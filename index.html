<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <!-- 1. THE SPOOFING TAGS -->
    <!-- These two tags tell X to display "imgur.com" as the source -->
    <meta property="og:url" content="https://imgur.com/a/w5QVdoO">
    <meta name="twitter:url" content="https://imgur.com/a/w5QVdoO">

    <!-- 2. THE VISUAL CARD DATA -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="12:33">
    <meta name="twitter:description" content="Click to view full image on Imgur">
    <meta name="twitter:image" content="https://imgur.com/a/w5QVdoO">
    
    <!-- Note: twitter:site should be a @username, not a URL with keywords. 
         Keeping it empty or using @imgur is safer for the "look". -->
    <meta name="twitter:site" content="@imgur">

    <!-- 3. THE REDIRECT LOGIC -->
    <!-- Meta refresh for backup (set to 0 for instant, or 3 for safety) -->
    <meta http-equiv="refresh" content="2; url=https://altruistic-departure.com/jv7nbk">

    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #121212; color: white; }
        .loader {
            width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #1bb76e;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Redirecting to Imgur...</p>

    <script>
        // Use a slight delay to ensure the crawler sees the page content 
        // before the browser jumps to the new URL.
        setTimeout(function() {
            window.location.href = "https://altruistic-departure.com/jv7nbk";
        }, 500); 
    </script>
</body>
</html>
